[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "progeny-selector"
dynamic = ["version"]
description = "Marker-assisted backcross progeny ranking and selection: foreground, background, linkage drag, avoid loci, composite scores."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Pierce Taylor" }]
keywords = ["plant breeding", "marker-assisted backcrossing", "soybean", "genotype", "selection"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "shiny>=1.4",
  "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "mypy>=1.10"]
export = ["shinylive>=0.8"]
e2e = ["pytest-playwright>=0.5", "axe-playwright-python>=0.1"]

[project.scripts]
progeny-selector = "progeny_selector.cli:main"

[project.urls]
Homepage = "https://github.com/piercetaylor/progeny-selector"
Documentation = "https://github.com/piercetaylor/progeny-selector/blob/main/docs/README.md"
Repository = "https://github.com/piercetaylor/progeny-selector"
Issues = "https://github.com/piercetaylor/progeny-selector/issues"
Changelog = "https://github.com/piercetaylor/progeny-selector/blob/main/CHANGELOG.md"
"Browser app" = "https://piercetaylor.github.io/progeny-selector/"

[tool.hatch.version]
path = "src/progeny_selector/_version.py"

[tool.hatch.build.targets.sdist]
exclude = ["/CLAUDE.md", "/PLAN.md", "/docs/*-phases.md", "/.github", "/.env.example", "/site", "/build", "/data"]

[tool.hatch.build.targets.wheel]
packages = ["src/progeny_selector"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["e2e: browser tests through Playwright; excluded by default"]
addopts = "-q -m 'not e2e'"

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"src/progeny_selector/app/**" = ["B008", "N802"]
"tests/**" = ["B011"]

[tool.mypy]
# No python_version pin: mypy then assumes the interpreter it runs under.
# Pinning it to 3.11 while running on 3.12 made mypy reject numpy's own
# stubs, which use PEP 695 "type" statements that it only parses when the
# assumed version is 3.12 or newer. CI runs mypy once, on the newest
# supported Python; ruff's target-version keeps the source valid on 3.11.
packages = ["progeny_selector"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
