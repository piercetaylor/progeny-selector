name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Typechecking is static, so it runs once rather than per interpreter.
      # numpy ships PEP 695 stubs that mypy only parses when it assumes
      # Python 3.12 or newer; ruff (target-version py311) keeps the source
      # valid on 3.11 and pytest exercises both.
      - run: mypy
        if: matrix.python-version == '3.12'
      - run: pytest --cov=progeny_selector --cov-report=term-missing
      - name: fixture is reproducible
        run: |
          python scripts/make_fixture.py
          git diff --exit-code -- tests/fixtures
      - name: contract manifest matches its files
        run: python scripts/check_contract.py

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,e2e]"
      - run: playwright install --with-deps chromium
      - run: pytest -m e2e

  export:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,export,e2e]"
      - name: find the shinylive asset cache path
        id: assets
        run: |
          dir=$(shinylive assets info | sed -n 2p | xargs)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: shinylive version
        id: shinylive_version
        run: |
          v=$(python -c "import importlib.metadata as m; print(m.version('shinylive'))")
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.assets.outputs.dir }}
          key: shinylive-${{ steps.shinylive_version.outputs.v }}-${{ hashFiles('pyproject.toml') }}
      - run: python scripts/build_shinylive.py
      - run: playwright install --with-deps chromium
      - name: export smoke test
        run: pytest -m e2e tests/e2e/test_shinylive_export.py
        env:
          PS_SITE_DIR: site
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: site

  deploy-pages:
    # Publishes the shinylive static export to GitHub Pages (Pages source must be
    # "GitHub Actions"). actions/deploy-pages returns 404 and fails, rather than
    # skipping, when Pages is off, which would mark every push to main as failed.
    # Set the repository variable ENABLE_PAGES to "true" once Pages is enabled.
    needs: export
    if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
