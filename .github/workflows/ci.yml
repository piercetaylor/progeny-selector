name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=progeny_selector --cov-report=term-missing
      - name: fixture is reproducible
        run: |
          python scripts/make_fixture.py
          git diff --exit-code -- tests/fixtures
      - name: shinylive export builds
        run: |
          pip install build
          python -m build --wheel
          shinylive export src/progeny_selector/app site
        if: matrix.python-version == '3.12'
      - uses: actions/upload-pages-artifact@v3
        if: matrix.python-version == '3.12' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: site

  deploy-pages:
    # Publishes the shinylive static export to GitHub Pages (Pages source must be "GitHub Actions").
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
