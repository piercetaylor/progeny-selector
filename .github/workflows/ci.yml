name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # Typechecking is static, so it runs once, on the newest supported
      # Python (3.13). numpy ships PEP 695 stubs that mypy only parses when it
      # assumes Python 3.12 or newer; ruff (target-version py311) keeps the
      # source valid on 3.11 and pytest exercises all three.
      - run: mypy
        if: matrix.python-version == '3.13'
      - run: pytest --cov=progeny_selector --cov-report=term-missing
      - name: fixture is reproducible
        run: |
          python scripts/make_fixture.py
          git diff --exit-code -- tests/fixtures src/progeny_selector/examples
      - name: contract manifest matches its files
        run: python scripts/check_contract.py

  unit-os:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest

  package:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip build twine cffconvert
      - run: cffconvert --validate
      - run: python -m build
      - run: twine check --strict dist/*
      - name: wheel carries the examples and the sdist excludes the working documents
        run: |
          unzip -l dist/*.whl | grep -E 'progeny_selector/examples/synthetic_bc2f1/genotypes\.vcf$'
          unzip -l dist/*.whl | grep -E 'progeny_selector/examples/synthetic_bc3f1/samples\.csv$'
          ! tar tzf dist/*.tar.gz | grep -E '/(CLAUDE|PLAN)\.md$'
          tar tzf dist/*.tar.gz | grep -E '/tests/fixtures/synthetic_bc2f1/genotypes\.vcf$'
          tar tzf dist/*.tar.gz | grep -E '/LICENSE$'
      - name: fresh venv from the wheel
        run: |
          python -m venv "$RUNNER_TEMP/fresh"
          "$RUNNER_TEMP/fresh/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/fresh/bin/pip" install dist/*.whl
      - name: smoke from outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          set -euo pipefail
          PS=fresh/bin/progeny-selector; PY=fresh/bin/python
          $PS --version | tee version.txt
          v=$(cut -d' ' -f2 version.txt)
          ls "$GITHUB_WORKSPACE"/dist/progeny_selector-"$v"-py3-none-any.whl
          $PY -c "import progeny_selector, importlib.metadata as m; assert m.version('progeny-selector') == progeny_selector.__version__"
          $PS example --out ex
          $PS validate --genotypes ex/synthetic_bc2f1/genotypes.vcf --samples ex/synthetic_bc2f1/samples.csv --markers ex/synthetic_bc2f1/markers.csv --criteria ex/synthetic_bc2f1/criteria.yaml
          $PS rank --genotypes ex/synthetic_bc2f1/genotypes.vcf --samples ex/synthetic_bc2f1/samples.csv --markers ex/synthetic_bc2f1/markers.csv --criteria ex/synthetic_bc2f1/criteria.yaml --out results.csv | grep -F "40 individuals, 11 pass hard filters"
          $PS select --results results.csv --top 3 --out selected.csv --next-manifest next_samples.csv --next-generation BC3F1 --samples ex/synthetic_bc2f1/samples.csv
          test "$(tail -n +2 selected.csv | wc -l)" -eq 6
          $PS rank --genotypes ex/synthetic_bc3f1/genotypes.vcf --samples ex/synthetic_bc3f1/samples.csv --markers ex/synthetic_bc3f1/markers.csv --criteria ex/synthetic_bc3f1/criteria.yaml --out results_bc3f1.csv | grep -F "40 individuals"
          $PY -c "import progeny_selector.app.app as a; assert a.app is not None"
          $PS app --help
          $PS app --no-browser --port 8765 & pid=$!
          for i in $(seq 1 60); do curl -fsS http://127.0.0.1:8765/ -o page.html && break; sleep 1; done
          grep -F "<title>progeny-selector</title>" page.html
          kill $pid
      - name: sdist installs too
        run: |
          python -m venv "$RUNNER_TEMP/fromsdist"
          "$RUNNER_TEMP/fromsdist/bin/pip" install dist/*.tar.gz
          "$RUNNER_TEMP/fromsdist/bin/progeny-selector" --version
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  r-reader:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e .
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - id: r-deps
        uses: r-lib/actions/setup-r-dependencies@v2
        continue-on-error: true
        with:
          packages: any::readr
      - name: readr fallback install
        if: steps.r-deps.outcome == 'failure'
        run: Rscript -e 'install.packages("readr", repos = "https://cloud.r-project.org")'
      - name: rank the fixture
        run: |
          progeny-selector rank --genotypes tests/fixtures/synthetic_bc2f1/genotypes.vcf \
            --samples tests/fixtures/synthetic_bc2f1/samples.csv \
            --markers tests/fixtures/synthetic_bc2f1/markers.csv \
            --criteria tests/fixtures/synthetic_bc2f1/criteria.yaml --out results.csv
      - name: write an empty results.csv
        run: python -c "from progeny_selector.io.export import write_results_csv; write_results_csv([], 'empty_results.csv')"
      - run: Rscript scripts/read_results.R results.csv
      - run: Rscript scripts/read_results.R empty_results.csv

  e2e:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,e2e]"
      - run: playwright install --with-deps chromium
      - run: pytest -m e2e

  export:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev,export,e2e]"
      - name: find the shinylive asset cache path
        id: assets
        run: |
          dir=$(shinylive assets info | sed -n 2p | xargs)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - name: shinylive version
        id: shinylive_version
        run: |
          v=$(python -c "import importlib.metadata as m; print(m.version('shinylive'))")
          echo "v=$v" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.assets.outputs.dir }}
          key: shinylive-${{ steps.shinylive_version.outputs.v }}-${{ hashFiles('pyproject.toml') }}
      - run: python scripts/build_shinylive.py
      - run: playwright install --with-deps chromium
      - name: export smoke test
        run: pytest -m e2e tests/e2e/test_shinylive_export.py
        env:
          PS_SITE_DIR: site
      - uses: actions/upload-pages-artifact@v3
        if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
        with:
          path: site

  deploy-pages:
    # Publishes the shinylive static export to GitHub Pages (Pages source must be
    # "GitHub Actions"). actions/deploy-pages returns 404 and fails, rather than
    # skipping, when Pages is off, which would mark every push to main as failed.
    # Set the repository variable ENABLE_PAGES to "true" once Pages is enabled.
    needs: export
    if: vars.ENABLE_PAGES == 'true' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
